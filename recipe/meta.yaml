{% set name = "prometheus_flask_exporter" %}
{% set version = "0.23.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rycus86/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 4782e92a77083d7a769d2199fabf1de6fc85d2563a81f4cfa30b9f492a743d16

build:
  skip: true  # [py<38]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - flask
    - prometheus_client
  run_constrained:
    - werkzeug>=3.0.1
    - zipp>=3.19.1

test:
  source_files:
    - tests
  imports:
    - prometheus_flask_exporter
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/rycus86/prometheus_flask_exporter
  summary: Prometheus metrics exporter for Flask
  description: |
    This library provides HTTP request metrics to export into Prometheus.
    It can also track method invocations using convenient functions.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/rycus86/prometheus_flask_exporter
  doc_url: https://github.com/rycus86/prometheus_flask_exporter/blob/master/README.md

extra:
  recipe-maintainers:
    - xhochy
